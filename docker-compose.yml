services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bts_api_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_KEY: base64:2RBB2CpPZT6lFpxXak7/kdro6rxYFzMOtFRYncxAy1w=
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    networks:
      - bts_network

  web:
    image: nginx:alpine
    container_name: bts_api_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bts_network

networks:
  bts_network:
    driver: bridge
